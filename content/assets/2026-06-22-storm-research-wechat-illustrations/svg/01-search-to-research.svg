<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">别再把 AI 当搜索框</title>
  <desc id="desc">一个搜索框被拆成视角、矛盾、简报、评审四个研究模块。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1d2428" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#f6f7f4"/>
  <rect x="72" y="72" width="1136" height="576" rx="28" fill="#ffffff" stroke="#d9ded8"/>
  <text x="112" y="136" fill="#1d2428" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="48" font-weight="800">别再把 AI 当搜索框</text>
  <text x="112" y="182" fill="#66727a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="500">先问视角，再看矛盾，最后做判断。</text>

  <g filter="url(#shadow)">
    <rect x="164" y="246" width="952" height="82" rx="41" fill="#fbfcfa" stroke="#cfd7d2" stroke-width="2"/>
    <circle cx="216" cy="287" r="17" fill="none" stroke="#0f766e" stroke-width="5"/>
    <line x1="228" y1="300" x2="247" y2="319" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/>
    <text x="278" y="297" fill="#7a858c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26">帮我总结一下这个主题</text>
  </g>

  <path d="M640 340 C640 382 640 392 640 430" fill="none" stroke="#93a4a0" stroke-width="3" stroke-dasharray="8 10"/>
  <path d="M620 410 L640 434 L660 410" fill="none" stroke="#93a4a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="150" y="448" width="216" height="126" rx="18" fill="#e3f2ef" stroke="#9ac7bf"/>
    <text x="258" y="496" text-anchor="middle" fill="#0f766e" font-size="30" font-weight="800">视角</text>
    <text x="258" y="535" text-anchor="middle" fill="#35535a" font-size="20">谁在看问题</text>

    <rect x="406" y="448" width="216" height="126" rx="18" fill="#e7edf8" stroke="#a7bce0"/>
    <text x="514" y="496" text-anchor="middle" fill="#315f9f" font-size="30" font-weight="800">矛盾</text>
    <text x="514" y="535" text-anchor="middle" fill="#35535a" font-size="20">哪里互相冲突</text>

    <rect x="662" y="448" width="216" height="126" rx="18" fill="#f7ecd0" stroke="#d6b768"/>
    <text x="770" y="496" text-anchor="middle" fill="#a16207" font-size="30" font-weight="800">简报</text>
    <text x="770" y="535" text-anchor="middle" fill="#35535a" font-size="20">什么值得相信</text>

    <rect x="918" y="448" width="216" height="126" rx="18" fill="#f8e4df" stroke="#dca298"/>
    <text x="1026" y="496" text-anchor="middle" fill="#b42318" font-size="30" font-weight="800">评审</text>
    <text x="1026" y="535" text-anchor="middle" fill="#35535a" font-size="20">哪些必须核验</text>
  </g>

  <text x="112" y="614" fill="#8a969c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18">AI 研究四步模板 · storm-research</text>
</svg>
