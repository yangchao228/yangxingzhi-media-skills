<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 负责展开材料，人负责最后判断</title>
  <desc id="desc">左右对照图，左侧是 AI 可做，右侧是人必须做，中间保留判断边界。</desc>
  <rect width="1280" height="720" fill="#f6f7f4"/>
  <rect x="68" y="70" width="1144" height="580" rx="28" fill="#ffffff" stroke="#d9ded8"/>
  <text x="112" y="138" fill="#1d2428" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="800">AI 负责展开材料，人负责最后判断</text>
  <text x="112" y="184" fill="#66727a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24">研究流程可以自动化，判断权不能外包。</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="116" y="248" width="440" height="298" rx="22" fill="#e7edf8" stroke="#a7bce0" stroke-width="2"/>
    <text x="336" y="304" text-anchor="middle" fill="#315f9f" font-size="32" font-weight="800">AI 可做</text>
    <g fill="#1d2428" font-size="25" font-weight="700">
      <text x="178" y="366">生成视角</text>
      <text x="178" y="426">整理冲突</text>
      <text x="178" y="486">输出简报</text>
    </g>
    <g fill="none" stroke="#315f9f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M145 356 l16 16 l30 -36"/>
      <path d="M145 416 l16 16 l30 -36"/>
      <path d="M145 476 l16 16 l30 -36"/>
    </g>

    <rect x="724" y="248" width="440" height="298" rx="22" fill="#e3f2ef" stroke="#9ac7bf" stroke-width="2"/>
    <text x="944" y="304" text-anchor="middle" fill="#0f766e" font-size="32" font-weight="800">人必须做</text>
    <g fill="#1d2428" font-size="25" font-weight="700">
      <text x="786" y="366">选择问题</text>
      <text x="786" y="426">核验证据</text>
      <text x="786" y="486">决定行动</text>
    </g>
    <g fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M753 356 l16 16 l30 -36"/>
      <path d="M753 416 l16 16 l30 -36"/>
      <path d="M753 476 l16 16 l30 -36"/>
    </g>

    <line x1="640" y1="232" x2="640" y2="570" stroke="#d2d9d5" stroke-width="4" stroke-dasharray="12 12"/>
    <circle cx="640" cy="392" r="74" fill="#1d2428"/>
    <text x="640" y="382" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800">判断权</text>
    <text x="640" y="418" text-anchor="middle" fill="#dce7e2" font-size="21" font-weight="700">留在人这里</text>
  </g>

  <text x="112" y="614" fill="#8a969c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18">Human3.0 · 认知主权 · storm-research</text>
</svg>
