<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent 会不会自己变强 - 旧版 SVG 布局参考</title>
  <style>
    body {
      margin: 0;
      padding: 40px 24px;
      background: #f7f3ec;

    main {
      max-width: 1120px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1.25;
    }

      color: #667085;
      font-size: 16px;
    }
    section {
      margin: 0 0 40px;

      margin: 0 0 14px;

<body>
  <main>

    <p class="note">此页只保留早期低保真布局参考，含 16:9 草图，不代表默认公众号贴图比例。正式公众号贴图统一使用 3:4 提示词，见 ../image-prompts/01-panorama-prompts.md。</p>

    <section>
      <h2>01 自改进三层定义</h2>
      <div class="frame">

    <section>
