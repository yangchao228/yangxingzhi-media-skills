    <rect x="120" y="1020" width="840" height="92" rx="18" fill="#F8EBD2"/>
    <text x="165" y="1080">06 下一次规则</text>
  </g>

  <rect x="120" y="1190" width="840" height="100" rx="24" fill="#1A1A1A"/>
  <text x="540" y="1254" text-anchor="middle" font-family="PingFang SC, Noto Sans SC, Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">评论“错题本”，领取模板</text>

  <text x="120" y="1340" font-family="PingFang SC, Noto Sans SC, Arial, sans-serif" font-size="28" fill="#667085">更早发现 / 更准判断 / 更快行动</text>
  <text x="760" y="1340" font-family="PingFang SC, Noto Sans SC, Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A">AI生命克劳德</text>
</svg>
