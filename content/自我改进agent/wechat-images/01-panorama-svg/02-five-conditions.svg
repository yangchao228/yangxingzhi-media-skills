  <text x="120" y="790" font-family="PingFang SC, Noto Sans SC, Arial, sans-serif" font-size="24" fill="#667085">更早发现 / 更准判断 / 更快行动</text>
  <text x="1260" y="790" font-family="PingFang SC, Noto Sans SC, Arial, sans-serif" font-size="24" font-weight="700" fill="#1A1A1A">AI生命克劳德</text>
